description: NXP MCUX Image Sensing Interface

compatible: "nxp,imx-isi"

include: [base.yaml, pinctrl-device.yaml]

properties:
  interrupts:
    required: true

  media-axi-clk-rate:
    required: true
    type: int

  media-apb-clk-rate:
    required: true
    type: int

child-binding:
  child-binding:
    include: video-interfaces.yaml
